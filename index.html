<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIRP.pl — Wkrótce</title>
  <meta name="robots" content="noindex, nofollow">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0b0f17;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .neon-text {
      text-shadow: 0 0 25px rgba(236, 72, 153, 0.5), 0 0 50px rgba(168, 85, 247, 0.3);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-6 text-center">

  <!-- Header Placeholder -->
  <header class="w-full max-w-4xl py-6 flex justify-center">
    <span class="text-xs tracking-widest uppercase bg-slate-800/60 border border-slate-700/60 text-slate-400 px-4 py-1.5 rounded-full">
      Projekt w fazie przygotowania
    </span>
  </header>

  <!-- Main Hero -->
  <main class="max-w-xl mx-auto flex flex-col items-center justify-center flex-grow py-12">
    <!-- Logo Brand -->
    <h1 class="text-6xl md:text-8xl font-black tracking-tight mb-4 select-none">
      <span class="bg-gradient-to-r from-fuchsia-500 via-pink-500 to-amber-400 bg-clip-text text-transparent neon-text">
        VIRP
      </span>
      <span class="text-slate-500 font-light">.pl</span>
    </h1>

    <p class="text-slate-400 text-base md:text-lg mb-8 max-w-md font-light leading-relaxed">
      Nowy wymiar polskiej społeczności Roleplay. Premiera wkrótce.
    </p>

    <!-- Status Badge -->
    <div class="inline-flex items-center gap-2.5 px-4 py-2 rounded-lg bg-slate-900/80 border border-slate-800 text-xs font-mono text-slate-300">
      <span class="w-2 h-2 rounded-full bg-fuchsia-500 animate-pulse"></span>
      Status: Rozwój platformy w toku
    </div>
  </main>

  <!-- Minimal Legal Footer -->
  <footer class="w-full max-w-2xl py-6 text-[11px] text-slate-600 border-t border-slate-900/80 space-y-2">
    <p>
      Nieoficjalny projekt społecznościowy. Strona nie jest powiązana z Take-Two Interactive ani Rockstar Games.
    </p>
    <p class="font-mono text-slate-700">
      © 2026 VIRP.pl • Wszelkie prawa zastrzeżone.
    </p>
  </footer>

</body>
</html>
